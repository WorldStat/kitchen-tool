{% extends 'base.html' %}
{% block content %}
<div class="container py-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0 rounded-4 p-4">
        <h2 class="fw-bold mb-4">Add New Recipe</h2>
        
        <div class="mb-4 p-3 bg-light rounded-3">
            <label class="form-label fw-bold">Import from Web</label>
            <div class="input-group">
                <input type="url" id="importUrl" class="form-control" placeholder="Paste recipe link here...">
                <button class="btn btn-primary fw-bold" type="button" id="magicBtn" onclick="autoFill()">
                    <span id="btnText"><i class="fa-solid fa-wand-magic-sparkles me-2"></i>Auto-Fill</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none"></span>
                </button>
            </div>
            <small class="text-muted mt-2 d-block">AI will extract title, ingredients, and steps.</small>
        </div>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Recipe Title</label>
                {{ form.title }}
            </div>
            <div class="mb-3">
                <label class="form-label">Ingredients</label>
                {{ form.ingredients }}
            </div>
            <div class="mb-3">
                <label class="form-label">Instructions</label>
                {{ form.instructions }}
            </div>
            <button type="submit" class="btn btn-dark w-100 rounded-pill py-2 fw-bold">Save Recipe</button>
        </form>
    </div>
</div>

<script>
async function autoFill() {
    const url = document.getElementById('importUrl').value;
    const btn = document.getElementById('magicBtn');
    const text = document.getElementById('btnText');
    const spinner = document.getElementById('btnSpinner');

    if (!url) return alert("Please paste a URL first!");

    // Start Loading State
    btn.disabled = true;
    text.classList.add('d-none');
    spinner.classList.remove('d-none');

    try {
        const response = await fetch(`/api/scrape/?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        if (data.error) throw new Error(data.error);

        // Fill Form Fields (Using Django form ID naming convention)
        document.getElementById('id_title').value = data.title || "";
        document.getElementById('id_ingredients').value = data.ingredients || "";
        document.getElementById('id_instructions').value = data.instructions || "";
        
        alert("Success! Review the fields and save.");
    } catch (err) {
        alert("Error: " + err.message);
    } finally {
        // Reset Button
        btn.disabled = false;
        text.classList.remove('d-none');
        spinner.classList.add('d-none');
    }
}
</script>
{% endblock %}
