{% extends 'base.html' %}

{% block content %}
<div class="container mt-5 text-center">
    <div class="card shadow-sm p-5 mx-auto border-0" style="max-width: 500px;">
        <div class="mb-4">
            <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
        </div>
        
        <h3 class="text-danger fw-bold">Confirm Deletion</h3>
        <p class="text-muted">Are you sure you want to delete:<br>
           <strong class="text-dark">{{ object }}</strong>?
        </p>
        <p class="small text-muted mb-4">This action cannot be undone.</p>
        
        <form method="POST">
            {% csrf_token %}
            <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                {% if "Shopping List" in object|stringformat:"s" or "/shopping/" in request.path %}
                    <a href="{% url 'shopping_list_history' %}" class="btn btn-light px-4">Cancel</a>
                {% else %}
                    <a href="{% url 'recipe_list' %}" class="btn btn-light px-4">Cancel</a>
                {% endif %}
                
                <button type="submit" class="btn btn-danger px-4 fw-bold">Yes, Delete permanently</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
