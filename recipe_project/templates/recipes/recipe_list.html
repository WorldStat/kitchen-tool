{% extends 'base.html' %}

{% block content %}
<style>
    .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    
    .recipe-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        padding-bottom: 100px; /* Space for floating bar */
    }

    /* Selection Logic */
    .card-container { position: relative; }
    .select-checkbox {
        position: absolute;
        top: 15px; left: 15px;
        z-index: 10;
        width: 24px; height: 24px;
        accent-color: var(--primary);
        cursor: pointer;
    }

    .recipe-card {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        border: 2px solid transparent;
        transition: all 0.2s;
        box-shadow: var(--shadow);
    }

    /* Highlight card when checkbox is checked */
    .card-container:has(.select-checkbox:checked) .recipe-card {
        border-color: var(--primary);
        background: #f0fdf4;
    }

    .card-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 10px 15px;
        background: #f8fafc;
        border-top: 1px solid #eee;
    }

    .action-link { font-size: 0.8rem; text-decoration: none; color: #64748b; font-weight: 600; }
    .action-link:hover { color: var(--primary); }

    /* FLOATING ACTION BAR */
    .shopping-bar {
        position: fixed;
        bottom: 80px; /* Above mobile nav */
        left: 50%;
        transform: translateX(-50%) translateY(150%);
        background: var(--primary);
        color: white;
        padding: 15px 30px;
        border-radius: 50px;
        display: flex;
        align-items: center;
        gap: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 1001;
        width: 90%;
        max-width: 500px;
    }

    .shopping-bar.active { transform: translateX(-50%) translateY(0); }

    .btn-generate {
        background: white;
        color: var(--primary);
        border: none;
        padding: 8px 18px;
        border-radius: 20px;
        font-weight: 800;
        cursor: pointer;
    }
</style>

<div class="header-area">
    <h2>{{ user.username }}'s Kitchen</h2>
    <a href="{% url 'create_recipe' %}" class="btn" style="background:var(--primary); color:white; padding:8px 15px; border-radius:8px; text-decoration:none;">+ New</a>
</div>

<form id="shopping-form" method="POST" action="{% url 'generate_shopping_list' %}">
    {% csrf_token %}
    
    <div class="recipe-grid">
        {% for recipe in recipes %}
        <div class="card-container">
            <input type="checkbox" name="selected_recipes" value="{{ recipe.id }}" class="select-checkbox" onchange="toggleBar()">
            
            <div class="recipe-card">
                <a href="{% url 'recipe_detail' recipe.pk %}" style="text-decoration:none; color:inherit;">
                    <div style="height:160px; background:#e2e8f0;">
                        {% if recipe.image %}<img src="{{ recipe.image.url }}" style="width:100%; height:100%; object-fit:cover;">{% endif %}
                    </div>
                    <div style="padding:15px;">
                        <h3 style="margin:0; font-size:1.1rem;">{{ recipe.title }}</h3>
                        <small style="color:#666;">{{ recipe.servings }} Servings</small>
                    </div>
                </a>
                
                <div class="card-actions">
                    <a href="{% url 'edit_recipe' recipe.pk %}" class="action-link">Edit</a>
                    <form action="{% url 'delete_recipe' recipe.pk %}" method="POST" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="action-link" style="border:none; background:none; cursor:pointer;" onclick="return confirm('Delete this recipe?')">Delete</button>
                    </form>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div id="shopping-bar" class="shopping-bar">
        <span id="selection-count">0 recipes selected</span>
        <button type="submit" class="btn-generate">Generate Shopping List</button>
    </div>
</form>

<script>
    function toggleBar() {
        const checkboxes = document.querySelectorAll('.select-checkbox:checked');
        const bar = document.getElementById('shopping-bar');
        const countText = document.getElementById('selection-count');
        
        if (checkboxes.length > 0) {
            bar.classList.add('active');
            countText.innerText = `${checkboxes.length} recipe${checkboxes.length > 1 ? 's' : ''} selected`;
        } else {
            bar.classList.remove('active');
        }
    }
</script>

{% endblock %}
