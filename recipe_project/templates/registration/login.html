{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100 bg-light">
    <div class="card shadow-lg border-0 rounded-3" style="max-width: 400px; width: 100%;">
        <div class="card-body p-4 p-sm-5">
            
            <div class="text-center mb-4">
                <h2 class="fw-bold text-success">Kitchen Tool</h2>
                <p class="text-muted">Welcome back, Chef!</p>
            </div>

            {% if form.errors %}
                <div class="alert alert-danger text-center p-2" role="alert">
                    <small>Username or password incorrect.</small>
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                
                <div class="form-floating mb-3">
                    <input type="text" name="username" class="form-control" id="floatingInput" placeholder="Username" required autofocus>
                    <label for="floatingInput">Username</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                    <label for="floatingPassword">Password</label>
                </div>

                <input type="hidden" name="next" value="{{ next }}">

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-success btn-lg fw-bold">Log In</button>
                </div>

                <div class="text-center">
                    <p class="small text-muted">
                        New here? <a href="{% url 'register' %}" class="text-decoration-none fw-bold text-success">Create an account</a>
                    </p>
                    <p class="small">
                        <a href="{% url 'password_reset' %}" class="text-muted">Forgot password?</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
