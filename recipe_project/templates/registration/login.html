{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background: white;">
    <h2 style="text-align: center; color: #2d6a4f;">Welcome Back</h2>
    <form method="post">
        {% csrf_token %}
        
        {% if form.errors %}
            <p style="color: red; text-align: center;">Your username and password didn't match. Please try again.</p>
        {% endif %}

        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold;">Username</label>
            {{ form.username }}
        </div>
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold;">Password</label>
            {{ form.password }}
        </div>

        <button type="submit" style="width: 100%; padding: 10px; background: #2d6a4f; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem;">
            Log In
        </button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>
    
    <p style="text-align: center; margin-top: 15px;">
        New here? <a href="{% url 'register' %}">Create an account</a>
    </p>
</div>
{% endblock %}
