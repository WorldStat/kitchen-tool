{% extends 'base.html' %}
{% block content %}
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-body p-5">
            <h2 class="fw-bold mb-4">{{ title }}</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    {{ form.title }}
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'shopping_list_history' %}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-success px-4">Save List</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
