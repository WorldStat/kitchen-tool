<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KitchenTool</title>
    <style>
        :root {
            --primary: #2d6a4f;
            --primary-light: #40916c;
            --bg: #f8fafc;
            --white: #ffffff;
            --text: #1e293b;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg); 
            margin: 0; padding-bottom: 70px; /* Space for mobile nav */
        }

        /* --- DESKTOP NAV --- */
        .top-nav {
            background: var(--white);
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10%;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-weight: 800; color: var(--primary); text-decoration: none; font-size: 1.2rem; }

        /* --- MOBILE BOTTOM NAV --- */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--white);
            height: 65px;
            border-top: 1px solid #e2e8f0;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            text-decoration: none;
            color: #64748b;
            font-size: 0.7rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item.active { color: var(--primary); font-weight: 600; }
        .nav-icon { font-size: 1.4rem; }

        @media (max-width: 768px) {
            .top-nav .nav-links { display: none; }
            .mobile-nav { display: flex; }
            .container { padding: 15px; margin-top: 10px; }
        }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
        
        .btn-circle {
            background: var(--primary);
            color: white;
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(45, 106, 79, 0.4);
            margin-top: -30px; /* Floating effect */
            border: 4px solid var(--white);
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="{% url 'landing_page' %}" class="logo">🥗 KitchenTool</a>
        <div class="nav-links">
            {% if user.is_authenticated %}
                <a href="{% url 'recipe_list' %}" style="margin-right:20px; text-decoration:none; color:var(--text);">My Collection</a>
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}<button type="submit" style="background:none; border:none; color:red; cursor:pointer;">Logout</button>
                </form>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% if user.is_authenticated %}
    <div class="mobile-nav">
        <a href="{% url 'recipe_list' %}" class="nav-item">
            <span class="nav-icon">📖</span>
            <span>Recipes</span>
        </a>
        <a href="{% url 'create_recipe' %}" class="nav-item">
            <div class="btn-circle">➕</div>
            <span style="margin-top: 5px;">Add</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">🛒</span>
            <span>List</span>
        </a>
    </div>
    {% endif %}

</body>
</html>
