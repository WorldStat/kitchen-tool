<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KitchenTool | App</title>
    <style>
        :root {
            --primary: #2d6a4f;
            --primary-light: #40916c;
            --accent: #d8f3dc;
            --bg: #f8fafc;
            --white: #ffffff;
            --text: #1e293b;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
        }

        body { 
            font-family: 'Inter', -apple-system, system-ui, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            color: var(--text);
            padding-bottom: 80px; /* Space for mobile nav */
        }

        /* --- DESKTOP TOP NAV --- */
        .top-nav {
            background: var(--white);
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-weight: 800; color: var(--primary); text-decoration: none; font-size: 1.4rem; display: flex; align-items: center; gap: 8px; }

        .nav-links { display: flex; gap: 25px; align-items: center; }
        .nav-link { text-decoration: none; color: var(--text); font-weight: 500; font-size: 0.95rem; }
        .nav-link:hover { color: var(--primary); }

        .btn-logout { background: none; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; cursor: pointer; color: #64748b; }

        /* --- MOBILE BOTTOM NAV --- */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--white);
            height: 70px;
            border-top: 1px solid #e2e8f0;
            justify-content: space-around;
            align-items: center;
            z-index: 2000;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            text-decoration: none;
            color: #94a3b8;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
        }

        .nav-item.active { color: var(--primary); font-weight: 700; }
        .nav-icon { font-size: 1.5rem; }

        .btn-circle {
            background: var(--primary);
            color: white;
            width: 54px; height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(45, 106, 79, 0.3);
            margin-top: -35px;
            border: 5px solid var(--white);
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .top-nav .nav-links { display: none; }
            .mobile-nav { display: flex; }
            .container { padding: 15px; }
        }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
        
        /* Alerts */
        .alert { padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; font-weight: 500; }
        .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="{% url 'landing_page' %}" class="logo">🥗 KitchenTool</a>
        <div class="nav-links">
            {% if user.is_authenticated %}
                <a href="{% url 'recipe_list' %}" class="nav-link">Recipes</a>
                <a href="{% url 'shopping_list_history' %}" class="nav-link">Shopping Lists</a>
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}<button type="submit" class="btn-logout">Logout</button>
                </form>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for m in messages %}
                <div class="alert alert-{{ m.tags }}">{{ m }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    {% if user.is_authenticated %}
    <div class="mobile-nav">
        <a href="{% url 'recipe_list' %}" class="nav-item {% if 'recipe' in request.path and 'create' not in request.path %}active{% endif %}">
            <span class="nav-icon">📖</span>
            <span>Recipes</span>
        </a>
        <a href="{% url 'create_recipe' %}" class="nav-item">
            <div class="btn-circle">＋</div>
            <span style="margin-top: 6px;">Add</span>
        </a>
        <a href="{% url 'shopping_list_history' %}" class="nav-item {% if 'shopping' in request.path %}active{% endif %}">
            <span class="nav-icon">🛒</span>
            <span>Lists</span>
        </a>
    </div>
    {% endif %}

</body>
</html>
